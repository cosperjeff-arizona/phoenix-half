<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phoenix Half Marathon</title>
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <div class="page">
    <div class="container">
      <header class="header">
        <!-- Rendered by JS -->
      </header>

      <main class="main">
        <section class="section">
          <div class="section__header">
            <h2 class="section__title">This Week</h2>
          </div>
          <div id="week-grid" class="grid grid--week">
            <!-- Rendered by JS -->
          </div>
        </section>

        <section class="section">
          <div class="section__header">
            <h2 class="section__title">Targets</h2>
          </div>
          <div id="targets-grid" class="grid grid--2col">
            <!-- Rendered by JS -->
          </div>
        </section>

        <section class="section">
          <div class="section__header">
            <h2 class="section__title">Rules</h2>
          </div>
          <div id="rules-container">
            <!-- Rendered by JS -->
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="footer__content">
          <!-- Rendered by JS -->
        </div>
      </footer>
    </div>
  </div>

  <script type="module" src="scripts/app.js"></script>
</body>
</html>
